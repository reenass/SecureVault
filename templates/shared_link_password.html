{% extends "base.html" %}

{% block title %}Protected Share{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card fade-in">
                <div class="card-header text-center">
                    <h5 class="mb-0">
                        <i class="fas fa-lock me-2 text-warning"></i>
                        Password Protected
                    </h5>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="fas fa-file-shield fa-4x text-primary mb-3"></i>
                        <p class="text-muted">This shared file is password protected.</p>
                    </div>
                    
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="mb-4">
                            <label class="form-label">Enter Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" 
                                   required placeholder="Enter share password" autofocus>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-unlock me-2"></i>Access File
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
